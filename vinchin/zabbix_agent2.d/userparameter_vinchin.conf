# Vinchin Backup & Recovery v9 -> Zabbix Agent 2
# Положите в /etc/zabbix/zabbix_agent2.d/userparameter_vinchin.conf
# и перезапустите: systemctl restart zabbix-agent2
#
# Скрипт: /etc/zabbix/scripts/vinchin_collect.py  (chmod 755)
#
# Параметры подключения НЕ хранятся в файлах — они задаются макросами хоста в Zabbix
# и приходят как аргументы ключа: [$1=url, $2=username, $3=password].
# Макросы: {$VINCHIN.URL}, {$VINCHIN.USERNAME}, {$VINCHIN.PASSWORD} (secret).

UserParameter=vinchin.summary[*],/etc/zabbix/scripts/vinchin_collect.py --url "$1" --username "$2" --password "$3" summary
UserParameter=vinchin.jobs[*],/etc/zabbix/scripts/vinchin_collect.py --url "$1" --username "$2" --password "$3" jobs
UserParameter=vinchin.storages[*],/etc/zabbix/scripts/vinchin_collect.py --url "$1" --username "$2" --password "$3" storages
UserParameter=vinchin.nodes[*],/etc/zabbix/scripts/vinchin_collect.py --url "$1" --username "$2" --password "$3" nodes
